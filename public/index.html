<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alignbox Chat</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <button class="icon-btn back-btn">&larr;</button>
            <img src="https://i.pravatar.cc/48?img=10" alt="Group Avatar" class="group-avatar" />
            <div class="group-info">
                <div class="group-name">Fun Friday Group</div>
            </div>
            <button class="icon-btn anon-toggle" id="toggleAnon" title="Toggle Anonymous Mode">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
        </header>

        <main class="chat-area" id="chatArea">
        </main>

        <div class="notice" id="notice"></div>

        <footer class="compose">
            <div class="down">

                <input id="messageInput" placeholder="Type a message..." autocomplete="off" />
                
                <button class="icon-btn disabled" title="Attachments disabled"><img src="./attach-clipboard-button.png" alt="" class="imgi"></button>
                <button class="icon-btn disabled" title="Camera disabled"><img src="./photo-camera.png" alt="" class="imgi"></button>
            </div>
             
            <button id="sendBtn" class="send-btn">➤</button>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
